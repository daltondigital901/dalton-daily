name: DNS check (daltondaily.com)

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/dns-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List records on daltondaily.com and www
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          Z=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=daltondaily.com")
          ZID=$(echo "$Z" | jq -r '.result[0].id')
          echo "::notice title=zone::id=$ZID status=$(echo "$Z" | jq -r '.result[0].status') errors=$(echo "$Z" | jq -c '.errors')"
          R=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=100")
          echo "$R" | jq -r '.result[] | "\(.type) \(.name) -> \(.content) proxied=\(.proxied)"' | while read -r line; do echo "::notice title=dns::$line"; done
          echo "::notice title=dns-errors::$(echo "$R" | jq -c '.errors')"
