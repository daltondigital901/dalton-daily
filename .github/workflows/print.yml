name: Print edition (11x17 PDF)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD); blank for latest"
        required: false
  push:
    branches: [main]
    paths: ["print/request.txt"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - name: Render
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ] && [ -f print/request.txt ]; then DATE=$(head -1 print/request.txt | tr -d '[:space:]'); fi
          node scripts/render-print.mjs "$DATE" "print/dalton-daily-${DATE:-latest}.pdf"
      - name: Commit PDF
        run: |
          git config user.name "dalton-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add print/*.pdf
          git commit -m "Print edition PDF" || echo "nothing to commit"
          git push
