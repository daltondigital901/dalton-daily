name = "dalton-daily"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# 3:00 AM Central year-round: both UTC slots fire, the handler only runs the one that lands at 3 AM in Chicago.
[triggers]
crons = ["0 8 * * *", "0 9 * * *"]

[vars]
MODEL = "claude-sonnet-5-5"
TIMEZONE = "America/Chicago"
EDITION_HOUR = "3"
SEARCHES_PER_SECTION = "5"

[[d1_databases]]
binding = "DB"
database_name = "dalton-daily"
database_id = "436f1d56-d609-428b-816e-9fe39ee95292"

[[workflows]]
name = "dalton-daily-edition"
binding = "EDITION"
class_name = "EditionWorkflow"

[observability]
enabled = true

# Secrets (set by the deploy workflow from GitHub repo secrets):
#   ANTHROPIC_API_KEY  - Claude API key used to write each edition
