name = "dalton-daily"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Printed by 3:00 AM Central: first attempt at 2:00 AM, backup attempt at 2:30 AM if the first did not land.
# Both UTC slots fire year-round; the handler only acts in the slot that is 2 AM in Chicago (handles DST).
[triggers]
crons = ["0 7 * * *", "30 7 * * *", "0 8 * * *", "30 8 * * *"]

[vars]
MODEL = "claude-sonnet-5-5"
TIMEZONE = "America/Chicago"
EDITION_HOUR = "2"
SEARCHES_PER_SECTION = "7"

[[d1_databases]]
binding = "DB"
database_name = "dalton-daily"
database_id = "436f1d56-d609-428b-816e-9fe39ee95292"

[[workflows]]
name = "dalton-daily-edition"
binding = "EDITION"
class_name = "EditionWorkflow"

[observability]
enabled = true

# Secrets (set by the deploy workflow from GitHub repo secrets):
#   ANTHROPIC_API_KEY  - Claude API key used to write each edition
