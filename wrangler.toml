name = "dalton-daily"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Public address. The bare domain redirects to www in the Worker.
[[routes]]
pattern = "www.daltondaily.com"
custom_domain = true

[[routes]]
pattern = "daltondaily.com"
custom_domain = true

# Printed by 3:00 AM Central. Midnight: batch run (half price) with a 2:15 AM deadline and live fallback;
# 12:30: retry slot; 2:30: last-resort live run. Both CDT and CST UTC slots fire; the handler acts only
# on the slot that matches Chicago local time.
[triggers]
crons = ["0 5 * * *", "30 5 * * *", "0 6 * * *", "30 6 * * *", "30 7 * * *", "30 8 * * *"]

[vars]
MODEL = "claude-sonnet-5-5"
TIMEZONE = "America/Chicago"
EDITION_HOUR = "0"
SEARCHES_PER_SECTION = "7"
SEARCH_TOOL = "web_search_20250305"

[[d1_databases]]
binding = "DB"
database_name = "dalton-daily"
database_id = "436f1d56-d609-428b-816e-9fe39ee95292"

[[workflows]]
name = "dalton-daily-edition"
binding = "EDITION"
class_name = "EditionWorkflow"

[observability]
enabled = true

# Secrets (set by the deploy workflow from GitHub repo secrets):
#   ANTHROPIC_API_KEY  - Claude API key used to write each edition
